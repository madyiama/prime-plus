[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm[toml]>=3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-p3"
authors = [
    {name = "Olivier Beltramo-Martin, Benoit Neichel, Fabio Rossi, Guido Agapito, Cédric Plantet"},
]
description = "Telemetry-based adaptive optics PSF reconstruction (P3 core)"
readme = "README.md"
urls = {repository = "https://github.com/madyiama/prime-plus"}
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "pandas>=1.3",
    "pytz",
    "scipy",
    "pyyaml",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
namespaces = true
include = ["p3*", "scripts*"]
exclude = ["p3.deepLoop*", "p3.psfao21*", "p3.testing*"]

[tool.setuptools_scm]
write_to = "p3/_version.py"
