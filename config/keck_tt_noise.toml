# Keck STRAP tip-tilt measurement-noise estimation.
# P4-C PROVISIONAL FRAMEWORK CHOICE (P4-A n0013 benchmark):
#   noise=van_dam, covariance=legacy_psfr, mirror=unity,
#   Noll angular Gaussian OTF, band 0.65-0.95 Nyquist, Welch 512.
# This is A1: 31.58 mas RMS/axis versus 41.13 mas for the spectral
# comparison A3 on n0013. A2 /16=7.89 mas is diagnostic, NOT physical.
# The chosen method reduces provisional model jitter but is not a
# calibrated Keck 2020 noise/servo truth and was not fitted to NIRC2.
#
# To switch methods WITHOUT modifying this file, use for example:
#   --tt-profile spectral_comparison
#   --tt-profile gendron_comparison
# Or override each independently:
#   --tt-noise-method gendron --tt-jitter-model legacy_psfr
#   --tt-noise-method van_dam --tt-jitter-model spectral_closed_loop
# The default source remains these TOML fields when no profile is passed.
#
# Noise estimators: "van_dam", "gendron", "legacy_autocorrelation".
# The last two are exploratory on Keck LGS; none has an independent
# absolute detector calibration. APD ideal Poisson remains an audit,
# not a production option until gain/excess noise are calibrated.
# The HO WFS noise estimator remains unchanged.
[tip_tilt_noise]
method = "van_dam"

# van_dam only: fraction of the Nyquist frequency (fs/2) used to fit the
# rejection-corrected white measurement-noise PSD.
high_frequency_band = [0.65, 0.95]
welch_nperseg = 512

# Tip-tilt covariance propagated into the PSF-R optical transfer function.
# Preserve historical behavior by default until the instrument model has
# been calibrated independently. "spectral_closed_loop" is opt-in.
[tip_tilt_jitter]
method = "legacy_psfr" # or "spectral_closed_loop"
mirror_model = "unity" # or "ragland_2016_keck_ii" (published 2016 model)
welch_nperseg = 512

# Independent, UNCALIBRATED STRAP APD noise baseline.
# The numbers below are idealized reference hypotheses, NOT values
# independently measured for the Keck II APDs in 2020.
# Optical centroid gain is NOT determined by these values or by APD_IMAT.
[strap_apd_reference]
effective_photoelectrons_per_count = 1.0
excess_noise_factor = 1.0
read_noise_variance_counts2 = 0.0
sky_estimation_variance_counts2 = 0.0
monte_carlo_trials = 128
monte_carlo_seed = 2020
calibration_status = "unverified_hypothesis"
