name: PSF-R synthetic regression
on:
  push:
    branches:
      - main
      - "feat/psfr-*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install P3 and scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas scikit-image photutils
      - name: Compile source and scripts
        run: python -m compileall -q p3 scripts tests
      - name: Core Keck synthetic regressions (no FITS/SAV needed)
        run: |
          python -m pytest -q \
            tests/test_keck_tt_geometry_and_anisoplanatism.py \
            tests/test_keck_p4_tt_frame.py \
            tests/test_keck_p4_angular_otf_chain.py \
            tests/test_psfr_spectral_tt_kernel.py
      - name: Additional opt-in regression tests present in this branch
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          names = [
              "test_keck_p4c_tt_selection.py",
              "test_keck_p4b_strap_audit.py",
              "test_keck_p4d_dtt_mechanical_audit.py",
              "test_keck_p4e_tt_long_exposure_audit.py",
              "test_keck_p4f_tt_command_replay.py",
              "test_keck_p4g_ho_to_tt.py",
              "test_keck_r0_final_three_gates.py",
          ]
          existing = [str(pathlib.Path("tests") / n) for n in names
                      if (pathlib.Path("tests") / n).exists()]
          if existing:
              raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", "-q", *existing]))
          print("No additional optional tests in current branch")
          PY
